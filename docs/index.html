<style>
/* Layout: a betting-ticket workbench. Board on the left, a sticky slip on the right
   (a bottom sheet on phones). Scoreboard-condensed display type, mono figures. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#eceee9; --ink:#15201b; --muted:#5b6762;
  --line:#d6dad3; --accent:#0f5c45; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --good:#11804f; --good-soft:#dcf1e5; --thin:#9a6a00; --thin-soft:#f7ecd0;
  --bad:#b4372f; --bad-soft:#f6dedb; --unv:#55606b; --unv-soft:#e3e7ea;
  --focus:#2b6cd8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1d2723; --ink:#e6ece8; --muted:#94a29b;
  --line:#2a3631; --accent:#4cc79a; --accent-ink:#06120d; --accent-soft:#183a2e;
  --good:#4fd08f; --good-soft:#163a28; --thin:#e2b244; --thin-soft:#3a2f12;
  --bad:#f0857b; --bad-soft:#40201d; --unv:#a7b2bb; --unv-soft:#252d33; --focus:#7aa7ff;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1d2723; --ink:#e6ece8; --muted:#94a29b;
  --line:#2a3631; --accent:#4cc79a; --accent-ink:#06120d; --accent-soft:#183a2e;
  --good:#4fd08f; --good-soft:#163a28; --thin:#e2b244; --thin-soft:#3a2f12;
  --bad:#f0857b; --bad-soft:#40201d; --unv:#a7b2bb; --unv-soft:#252d33; --focus:#7aa7ff;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:16px 96px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.field label{color:var(--muted);font-size:12px;white-space:nowrap}
.field input{border:0;background:transparent;width:78px;outline:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px}
.banner b{font-weight:600}
.banner .warn{color:var(--thin);font-weight:500}
.banner .ok{color:var(--good);font-weight:500}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:4px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.filters input[type=search]{min-width:0;width:170px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.summary{color:var(--muted);font-size:12px;margin:2px 0 8px}

/* bet table */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th:nth-child(-n+2){text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
td:nth-child(-n+2){text-align:left}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--accent-soft)}
.cb{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.bet-name{font-weight:600}
.bet-sub{color:var(--muted);font-size:12px}
.flagtxt{color:var(--unv);font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.thin{background:var(--thin-soft);color:var(--thin)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.unv{background:var(--unv-soft);color:var(--unv)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.more{display:flex;justify-content:center;padding:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* slip */
.slip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slip-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.slip-head h2{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;margin:12px 14px 4px}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.legs{list-style:none;margin:0;padding:6px 14px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.leg .nm{font-weight:600;font-size:13px;min-width:0}
.leg .sub{color:var(--muted);font-size:11.5px}
.leg input{width:62px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 5px;text-align:right}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}
.slip-empty{padding:18px 14px;color:var(--muted);font-size:13px}
.verdict{margin:8px 14px;border-radius:10px;padding:12px 14px}
.verdict.good{background:var(--good-soft)} .verdict.thin{background:var(--thin-soft)}
.verdict.bad{background:var(--bad-soft)} .verdict.unv{background:var(--unv-soft)}
.verdict .v{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.verdict.good .v{color:var(--good)} .verdict.thin .v{color:var(--thin)} .verdict.bad .v{color:var(--bad)} .verdict.unv .v{color:var(--unv)}
.verdict p{margin:4px 0 0;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:8px 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:8px 10px}
.stat .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-family:var(--f-mono);font-size:17px;font-weight:600}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 14px}
.inputs label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inputs input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-family:var(--f-mono);font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;width:100%}
.warns{list-style:none;margin:6px 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.warns li{font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--thin-soft);color:var(--ink)}
.warns li.info{background:var(--surface-2)}
.slip-actions{display:flex;gap:8px;padding:10px 14px 14px}
.slip-actions .btn{flex:1}
.singles{margin:6px 14px;display:flex;flex-direction:column;gap:6px}
.single{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}

/* mobile slip */
.slipbar{display:none}
@media (max-width:1000px){
  .slip-col{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:30;max-height:calc(100% - 120px);overflow-y:auto;transform:translateY(130%);transition:transform .25s ease;padding:0 8px 8px}
  .slip-col.open{transform:none}
  .slip{position:static;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .slipbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;min-height:52px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);align-items:center;justify-content:space-between;gap:10px;border:0;cursor:pointer;font-weight:600}
  .slipbar .num{font-weight:600}
}
@media (prefers-reduced-motion:reduce){.slip-col{transition:none}}

/* cards (auto slips, my bets) */
.section-h{font-family:var(--f-display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px}
.section-h:first-child{margin-top:0}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-title{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.card ul{margin:0;padding-left:16px;font-size:13px}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.card .meta b{color:var(--ink);font-family:var(--f-mono)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--f-mono);font-size:20px;font-weight:600}
.status-seg{display:flex;gap:4px;flex-wrap:wrap}
.status-seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.status-seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.payouts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.payouts label{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px;color:var(--muted)}
.payouts input{width:60px;border:0;background:transparent;font-family:var(--f-mono);text-align:right}
.tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--muted)}
.reasons{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.reasons li{padding:8px 12px;border-radius:8px;font-size:13.5px;border-left:4px solid var(--line);background:var(--surface)}
.reasons li.good{border-left-color:var(--good)}
.reasons li.bad{border-left-color:var(--bad)}
.reasons li.info{border-left-color:var(--unv)}
.help{font-size:12.5px;color:var(--muted);margin-top:18px;max-width:75ch}
.help b{color:var(--ink)}
</style>

<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}.banner a{color:var(--accent);font-weight:600}</style>
</head>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function toast(msg) {

  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2200);
}

/* ---------------------------------------------------------------- board helpers */
const M = () => S.board.meta;
const minEv = () => M().min_ev ?? 0.02, minEdge = () => M().min_edge ?? 0.03;
const kellyF = () => M().kelly_fraction ?? 0.25, maxPct = () => M().max_stake_pct ?? 0.02;
let BET_INDEX = {}, LEG_INDEX = {}, GAME_INDEX = {};
function indexBoard() {
  BET_INDEX = {}; LEG_INDEX = {}; GAME_INDEX = {};
  for (const b of [...(S.board.bets || []), ...(S.board.props || [])]) BET_INDEX[b.id] = b;
  for (const l of S.board.teaser_legs || []) LEG_INDEX[l.id] = l;
  for (const g of S.board.games || []) GAME_INDEX[g.game] = g;
  const saved = LS.get("tpay", null);
  S.tpay = Object.assign({}, S.board.teaser_payouts || {2: -120, 3: 140, 4: 240, 5: 333, 6: 500}, saved || {});
}
const allBets = () => Object.values(BET_INDEX);
function kickoff(game) {
  const k = GAME_INDEX[game]?.kickoff;
  if (!k) return "";
  const d = new Date(k);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, {weekday: "short"}) + " " +
    d.toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
}
function kickoffTs(game) { const k = GAME_INDEX[game]?.kickoff; const t = k ? Date.parse(k) : NaN; return isNaN(t) ? 9e15 : t; }
function label(b) {
  if (b.kind === "prop") {
    if (b.market === "anytime_td") return `${b.player} anytime TD`;
    return `${b.player} ${b.bet} ${MARKET[b.market] || b.market}`;
  }
  return b.bet;
}
function typeOf(b) { return b.kind === "prop" ? "Prop" : b.type; }

/* one bet at the price shown (or the price the user typed) */
function legStats(b) {
  const odds = S.odds[b.id] ?? b.odds;
  const pw = b.p_win ?? b.hit, pp = b.p_push || 0;
  const hit = pw / (1 - pp), d = dec(odds), be = 1 / d;
  const ev = pw * (d - 1) - (1 - pw - pp);
  return {odds, pw, pp, hit, be, ev, edge: hit - be, d, flags: b.flags || []};
}
function verdictOf(ev, edge, flags, single) {
  if (flags && flags.length) return "unv";
  if (ev >= minEv() && (!single || edge >= minEdge())) return "good";
  if (ev >= 0) return "thin";
  return "bad";
}
const VERDICT_TEXT = {good: "Good bet", thin: "Thin edge", bad: "Losing bet", unv: "Can't verify"};
const pill = v => `<span class="pill ${v}">${VERDICT_TEXT[v]}</span>`;
function kellyStake(p, d, pushP = 0) {
  const b = d - 1, q = 1 - p - pushP;
  const f = Math.max(0, (b * p - q) / b) * kellyF();
  return Math.round(Math.min(f, maxPct()) * S.bankroll * 100) / 100;
}

/* ---------------------------------------------------------------- slip math */
function slipCalc() {
  const mode = S.mode;
  if (mode === "teaser") {
    const legs = S.teaserSel.map(id => LEG_INDEX[id]).filter(Boolean);
    const n = legs.length;
    const auto = S.tpay[n];
    const payoutOdds = parseOdds(S.payout) ?? auto ?? null;
    const P = legs.reduce((a, l) => a * l.hit, 1);
    const res = {mode, legs, n, P, payoutOdds, auto, warns: []};
    if (n < 2) return res;
    if (payoutOdds == null) { res.warns.push({t: `Enter DraftKings' payout for a ${n}-team teaser.`}); return res; }
    const d = dec(payoutOdds);
    Object.assign(res, {d, be: 1 / d, ev: P * d - 1, stake: kellyStake(P, d)});
    res.verdict = verdictOf(res.ev, 0, [], false);
    const games = legs.map(l => l.game);
    if (new Set(games).size < games.length) res.warns.push({t: "Two legs from the same game. They depend on each other, so the hit % above is off."});
    const nonWong = legs.filter(l => !l.wong).map(l => l.team);
    if (nonWong.length) res.warns.push({t: `${nonWong.join(", ")} ${nonWong.length > 1 ? "don't" : "doesn't"} cross both 3 and 7, so the 6 points buy less.`, info: true});
    if (n > 4) res.warns.push({t: "Each extra leg adds more of DraftKings' cut and more room for error in the estimates."});
    res.warns.push({t: "Teaser hit % uses the consensus spread. If DraftKings' line is different, that leg's chance changes.", info: true});
    return res;
  }
  const legs = S.betSel.map(id => BET_INDEX[id]).filter(Boolean);
  const st = legs.map(legStats);
  const res = {mode, legs, st, n: legs.length, warns: []};
  if (!legs.length) return res;
  const flagged = legs.filter(b => (b.flags || []).length);
  if (mode === "singles") {
    res.singles = legs.map((b, i) => ({b, s: st[i], v: verdictOf(st[i].ev, st[i].edge, st[i].flags, true),
      stake: kellyStake(st[i].pw, st[i].d, st[i].pp)}));
    flagged.forEach(b => res.warns.push({t: `${label(b)}: ${FLAG_TEXT[b.flags[0]]}`}));
    return res;
  }
  // parlay
  const P = st.reduce((a, s) => a * s.hit, 1);
  const dAuto = st.reduce((a, s) => a * s.d, 1);
  const typed = parseOdds(S.payout);
  const d = typed != null ? dec(typed) : dAuto;
  Object.assign(res, {P, dAuto, d, payoutOdds: amer(d), autoOdds: amer(dAuto), be: 1 / d, ev: P * d - 1});
  res.stake = kellyStake(P, d);
  res.verdict = verdictOf(res.ev, 0, flagged.flatMap(b => b.flags), false);
  if (legs.length === 1) res.warns.push({t: "Only one leg. Switch to Singles, or add more legs.", info: true});
  flagged.forEach(b => res.warns.push({t: `${label(b)}: ${FLAG_TEXT[b.flags[0]]}`}));
  const byGame = {};
  legs.forEach(b => (byGame[b.game] = (byGame[b.game] || 0) + 1));
  const sg = Object.entries(byGame).filter(([, c]) => c > 1).map(([g]) => g);
  if (sg.length) res.warns.push({t: `Same game (${sg.join(", ")}): DraftKings prices these as a same-game parlay and usually pays less. Type the payout it shows.`});
  const losers = legs.filter((b, i) => st[i].ev < 0);
  if (losers.length && legs.length > 1) res.warns.push({t: `${losers.map(label).join(", ")} ${losers.length > 1 ? "lose" : "loses"} money on ${losers.length > 1 ? "their" : "its"} own and drag${losers.length > 1 ? "" : "s"} the parlay down.`});
  if (legs.length > 4) res.warns.push({t: "Past 4 legs, DraftKings' cut and any error in one leg's estimate stack up fast."});
  if (typed != null && d < dAuto * 0.9) res.warns.push({t: `DraftKings pays ${fmtOdds(typed)}, below the ${fmtOdds(amer(dAuto))} the legs multiply to.`, info: true});
  return res;
}
function explain(r) {
  const payout = fmtOdds(amer(r.d));
  const per = r.ev >= 0 ? `make about ${cents(r.ev)} per $1 over the long run` : `lose about ${cents(r.ev)} per $1 over the long run`;
  return `Hits ${oneIn(r.P)} (${pct(r.P)}). At ${payout} it needs ${pct(r.be)}, so you'd ${per}.`;
}

/* ---------------------------------------------------------------- auto slips */
function* combos(arr, k, start = 0, pick = [], games = new Set()) {
  if (pick.length === k) { yield pick.slice(); return; }
  for (let i = start; i < arr.length; i++) {
    const g = arr[i].game;
    if (games.has(g)) continue;
    pick.push(arr[i]); games.add(g);
    yield* combos(arr, k, i + 1, pick, games);
    pick.pop(); games.delete(g);
  }
}
function autoParlays() {
  const elig = allBets().map(b => ({b, s: legStats(b)}))
    .filter(x => !x.s.flags.length && x.s.ev >= minEv() && x.s.edge >= minEdge())
    .sort((a, c) => c.s.ev - a.s.ev).slice(0, 28)
    .map(x => ({id: x.b.id, game: x.b.game, hit: x.s.hit, d: x.s.d, ev: x.s.ev, b: x.b}));
  const out = [];
  for (let k = 2; k <= 4; k++) {
    const best = [];
    for (const c of combos(elig, k)) {
      const P = c.reduce((a, x) => a * x.hit, 1), d = c.reduce((a, x) => a * x.d, 1);
      best.push({legs: c, P, d, ev: P * d - 1});
    }
    best.sort((a, c) => c.ev - a.ev);
    out.push({k, list: best.slice(0, 3), eligible: elig.length});
  }
  return {elig, out};
}
function autoTeasers() {
  const legs = (S.board.teaser_legs || []).slice().sort((a, c) => c.hit - a.hit).slice(0, 16);
  const out = [];
  for (let k = 2; k <= 6; k++) {
    const po = S.tpay[k];
    if (po == null) continue;
    const d = dec(po), best = [];
    for (const c of combos(legs, k)) {
      const P = c.reduce((a, x) => a * x.hit, 1);
      best.push({legs: c, P, d, ev: P * d - 1});
    }
    best.sort((a, c) => c.ev - a.ev);
    out.push({k, po, list: best.slice(0, 2)});
  }
  return out;
}

/* ---------------------------------------------------------------- bet detail */
function legInfo(l, s, n) {
  if (l.kind === "teaser") {
    const need = Math.pow(1 / dec(s.payout), 1 / n);
    return {hit: l.hit, need, edge: l.hit != null ? l.hit - need : null, ev: null, odds: null,
      v: l.hit == null ? "unv" : l.hit >= need ? "good" : "bad"};
  }
  const hit = l.hit ?? null, odds = l.odds ?? null;
  const need = l.be ?? (odds != null ? 1 / dec(odds) : null);
  const ev = l.ev ?? (hit != null && odds != null ? hit * dec(odds) - 1 : null);
  const edge = hit != null && need != null ? hit - need : null;
  const flags = l.flags || [];
  const v = flags.length || hit == null ? "unv" : verdictOf(ev, edge, [], true);
  return {hit, need, edge, ev, odds, v, flags};
}
function slipReasons(s, infos) {
  const out = [], n = (s.legs || []).length, d = dec(s.payout);
  const isTeaser = s.mode === "teaser";
  if (s.hit != null) {
    const fair = amer(1 / s.hit);
    if (s.ev >= 0) out.push({k: "good", t: `DraftKings pays ${fmtOdds(s.payout)}. A bet that hits ${pct(s.hit)} is fairly priced at about ${fmtOdds(fair)}, so you're being paid more than it's worth: about ${cents(s.ev)} of value per $1.`});
    else out.push({k: "bad", t: `DraftKings pays ${fmtOdds(s.payout)}, but a bet that hits ${pct(s.hit)} should pay about ${fmtOdds(fair)}. You're paid less than it's worth: about ${cents(s.ev)} lost per $1.`});
  } else out.push({k: "info", t: "There's no model estimate for this bet's hit chance, so its value can't be measured."});
  const flagged = (s.legs || []).filter((l, i) => infos[i].flags && infos[i].flags.length);
  flagged.forEach(l => out.push({k: "bad", t: `${l.label}: ${FLAG_TEXT[l.flags[0]] || "flagged by the model."}`}));
  if (s.flagged && !flagged.length) out.push({k: "bad", t: "Some legs were on the Skipped list (model and books disagreed by 25%+), so the model's numbers for them can't be trusted."});
  (s.legs || []).forEach(l => { if (l.note) out.push({k: "info", t: l.note}); });
  if (isTeaser) {
    const need = Math.pow(1 / d, 1 / n);
    out.push({k: "info", t: `A ${n}-team teaser at ${fmtOdds(s.payout)} needs each leg to hit about ${pct(need)}.`});
    const weak = (s.legs || []).filter(l => l.hit != null && l.hit < need);
    if (weak.length) out.push({k: "bad", t: `${weak.map(l => l.label.replace(" (teaser)", "")).join(", ")} ${weak.length > 1 ? "are" : "is"} below that, which pulls the ticket down.`});
    const strong = (s.legs || []).filter(l => l.hit != null && l.hit >= need);
    if (strong.length) out.push({k: "good", t: `${strong.map(l => l.label.replace(" (teaser)", "")).join(", ")} clear${strong.length > 1 ? "" : "s"} it.`});
    const nonWong = (s.legs || []).filter(l => l.wong === false);
    if (nonWong.length) out.push({k: "info", t: `${nonWong.map(l => l.label.replace(" (teaser)", "")).join(", ")} ${nonWong.length > 1 ? "don't" : "doesn't"} move through both 3 and 7, the most common winning margins, so the 6 points buy less.`});
  } else {
    const losers = (s.legs || []).filter((l, i) => infos[i].ev != null && infos[i].ev < 0);
    const winners = (s.legs || []).filter((l, i) => infos[i].ev != null && infos[i].ev >= 0);
    if (n > 1 && winners.length) out.push({k: "good", t: `${winners.length} of ${n} legs are good bets on their own, and their edges multiply together in the parlay.`});
    if (losers.length) out.push({k: "bad", t: `${losers.map(l => l.label).join(", ")} ${losers.length > 1 ? "lose" : "loses"} money on ${losers.length > 1 ? "their" : "its"} own, and that multiplies into the parlay too.`});
    const props = (s.legs || []).filter(l => l.model_proj != null && l.market_proj != null);
    props.forEach(l => {
      const gap = (l.model_proj - l.market_proj) / l.market_proj;
      const dir = l.side === "Under" ? (gap < 0 ? "agrees with your Under" : "leans against your Under") : (gap > 0 ? "agrees with your Over" : "leans against your Over");
      out.push({k: Math.abs(gap) > 0.2 ? "info" : "good", t: `${l.label}: the model projects ${l.model_proj.toFixed(1)} vs about ${l.market_proj.toFixed(1)} implied by the books (${sgnPct(gap)}), which ${dir}.${Math.abs(gap) > 0.2 ? " A gap this big can mean news the model hasn't seen." : ""}`});
    });
  }
  const games = (s.legs || []).map(l => l.game);
  const dup = [...new Set(games.filter((g, i) => games.indexOf(g) !== i))];
  if (dup.length) out.push({k: "info", t: `Same game (${dup.join(", ")}): these legs can move together, so the combined hit % is less certain than it looks.`});
  if (n > 4) out.push({k: "bad", t: `${n} legs: each one adds DraftKings' cut and another chance for an estimate to be off.`});
  if (s.status === "won" || s.status === "lost") {
    out.push({k: "info", t: `Result: ${s.status}. This bet was expected to win ${s.hit != null ? pct(s.hit) : "an unknown share"} of the time, so one result says little. Judge it by its value over many bets.`});
  }
  return out;
}
function renderSlipDetail(s) {
  const n = (s.legs || []).length;

  const v = s.ev != null ? verdictOf(s.ev, 0, s.flagged ? ["x"] : [], false) : "unv";
  const p = slipProfit(s);

  const isTeaser = s.mode === "teaser";
  let h = `<button class="btn small" id="backMine">← All bets</button>
  <div class="detail">
    <div class="card-top" style="margin-top:12px"><h2 class="section-h" style="margin:0">${esc(s.title || s.mode)}</h2>${pill(v)}</div>
    <p class="note" style="margin-top:4px">Week ${esc(s.week ?? "")} · placed ${new Date(s.createdAt).toLocaleString(undefined, {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"})} · ${esc((s.status || "open").toUpperCase())}</p>
    <div class="kpis">

      <div class="kpi"><div class="k">Hit chance</div><div class="val">${s.hit != null ? pct(s.hit) : "—"}</div></div>
      <div class="kpi"><div class="k">Needs</div><div class="val">${pct(1 / dec(s.payout))}</div></div>
      <div class="kpi"><div class="k">Value per $1</div><div class="val ${s.ev >= 0 ? "pos" : "neg"}">${s.ev != null ? sgnPct(s.ev) : "—"}</div></div>
      <div class="kpi"><div class="k">${p != null ? "Result" : "Expected profit"}</div><div class="val ${(p ?? s.ev ?? 0) >= 0 ? "pos" : "neg"}">${p != null ? money(p) : s.ev != null ? money(s.stake * s.ev) : "—"}</div></div>
    </div>
    <h3 class="section-h" style="font-size:17px">${{good: "Why it's a good bet", thin: "Why the edge is thin", bad: "Why it's a losing bet", unv: "Why it can't be verified"}[v]}</h3>
    <ul class="reasons">${reasons.map(r => `<li class="${r.k}">${esc(r.t)}</li>`).join("")}</ul>
    <h3 class="section-h" style="font-size:17px">Legs</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Leg</th><th>Game</th>${isTeaser ? "" : "<th>Odds</th>"}<th>Hit %</th><th>Needs</th><th>Edge</th>${isTeaser ? "" : "<th>Value</th>"}<th>Rating</th></tr></thead><tbody>
    ${(s.legs || []).map((l, i) => { const x = infos[i]; return `<tr><td><div class="bet-name">${esc(l.label)}${l.wong ? '<span class="tag">3 & 7</span>' : ""}</div>${l.model_proj != null ? `<div class="bet-sub">model ${l.model_proj.toFixed(1)}${l.market_proj != null ? ` · books ${l.market_proj.toFixed(1)}` : ""}</div>` : ""}</td>
      <td>${esc(l.game || "")}</td>${isTeaser ? "" : `<td class="num">${fmtOdds(x.odds)}</td>`}<td class="num">${pct(x.hit)}</td><td class="num">${pct(x.need)}</td>
      <td class="num ${x.edge >= 0 ? "pos" : "neg"}">${x.edge != null ? sgnPct(x.edge) : "—"}</td>${isTeaser ? "" : `<td class="num ${x.ev >= 0 ? "pos" : "neg"}">${x.ev != null ? sgnPct(x.ev) : "—"}</td>`}<td>${pill(x.v)}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="help">${isTeaser ? "<b>Needs</b> for a teaser leg is the hit rate each leg must reach for the whole ticket to break even at this payout." : "<b>Needs</b> is the win rate a leg's price requires. <b>Edge</b> is how far the hit % beats it."} Hit % for props blends the model's projection (40%) with the books' (60%).</p>
  </div>`;
  $("#main").innerHTML = h;

  const st = parseFloat(S.stake);
  if (S.mode === "singles") {
    return r.singles.map(x => ({...base, mode: "single", title: label(x.b),
      legs: [legRecord(x.b, x.s)],
      stake: x.stake > 0 ? x.stake : 1, payout: x.s.odds, hit: x.s.hit, ev: x.s.ev, flagged: x.s.flags.length > 0}));
  }
  if (r.ev == null) return [];
  const legs = S.mode === "teaser"
    ? r.legs.map(l => ({label: `${l.team} ${l.teased_line > 0 ? "+" : ""}${l.teased_line} (teaser)`, game: l.game, hit: l.hit,
        kind: "teaser", line: l.line, teased_line: l.teased_line, wong: !!l.wong}))
    : r.legs.map((b, i) => legRecord(b, r.st[i]));
  const stake = isFinite(st) && st > 0 ? st : (r.stake > 0 ? r.stake : 1);
  return [{...base, mode: S.mode, title: S.mode === "teaser" ? `${r.n}-team teaser` : `${r.n}-leg parlay`,
    legs, stake, payout: Math.round(amer(r.d)), hit: r.P, ev: r.ev,
    flagged: S.mode === "parlay" && r.legs.some(b => (b.flags || []).length)}];
}
async function saveSlip() {
  const recs = slipRecord();
  if (!recs.length) { toast("Add legs first"); return; }
  if (S.db) {
    try { for (const rec of recs) await S.db.collection("slips").add(rec); }
    catch (err) { toast(err?.code === "quota_exceeded" ? "Storage is full. Delete old bets." : "Couldn't save. Try again."); return; }
  } else {
    for (const rec of recs) S.slips.push({...rec, id: "l" + Date.now() + Math.random().toString(36).slice(2, 6)});
    LS.set("slips", S.slips);
  }
  toast(recs.length > 1 ? `Saved ${recs.length} bets` : "Saved to My bets");
  render();
}
async function setStatus(id, status) {
  if (S.db) { try { await S.db.doc("slips/" + id).update({status}); } catch { toast("Couldn't update. Try again."); } }
  else { const s = S.slips.find(x => x.id === id); if (s) { s.status = status; LS.set("slips", S.slips); render(); } }
}
/* the sportsbook shows "stake to win X"; turn that back into American odds */
async function saveEdit(id) {
  const stake = parseFloat($("#edStake").value), win = parseFloat($("#edWin").value);
  if (!(stake > 0) || !(win > 0)) { toast("Enter the stake and the amount it wins"); return; }
  const r = win / stake, payout = Math.round(r >= 1 ? r * 100 : -100 / r);
  const s = S.slips.find(x => x.id === id);
  const fields = {stake, payout};
  if (s && s.hit != null) fields.ev = s.hit * (1 + r) - 1;
  S.editing = null;
  if (S.db) { try { await S.db.doc("slips/" + id).update(fields); toast("Updated"); } catch { toast("Couldn't update. Try again."); } }
  else if (s) { Object.assign(s, fields); LS.set("slips", S.slips); render(); toast("Updated"); }
}
async function delSlip(id) {
  if (S.confirmDel !== id) { S.confirmDel = id; renderMine(); setTimeout(() => { if (S.confirmDel === id) { S.confirmDel = null; if (S.tab === "mine") renderMine(); } }, 4000); return; }
  S.confirmDel = null;
  if (S.db) { try { await S.db.doc("slips/" + id).delete(); } catch { toast("Couldn't delete. Try again."); } }
  else { S.slips = S.slips.filter(x => x.id !== id); LS.set("slips", S.slips); render(); }
}

function exportBets() {
  const blob = new Blob([JSON.stringify({slips: S.slips}, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `my_bets_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  toast(`Exported ${S.slips.length} bets`);
}
async function importBets(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("That file isn't valid JSON."); return; }
  const list = Array.isArray(data) ? data : data.slips;
  if (!Array.isArray(list)) { toast("No bets found in that file."); return; }
  const byId = Object.fromEntries(S.slips.map(s => [s.id, s]));
  let added = 0;
  for (const s of list) { if (s && s.id && s.legs) { if (!byId[s.id]) added++; byId[s.id] = s; } }
  S.slips = Object.values(byId); LS.set("slips", S.slips); render();
  toast(`Imported ${list.length} bets (${added} new)`);
}

/* ---------------------------------------------------------------- loading boards */
function validBoard(b) { return b && b.meta && Array.isArray(b.bets) && Array.isArray(b.games); }
function setBoard(b, from) {
  S.board = b; S.boardFrom = from; indexBoard();
  const ui = LS.get("ui", null);
  if (ui && ui.key === boardKey()) Object.assign(S, {betSel: ui.betSel || [], teaserSel: ui.teaserSel || [], mode: ui.mode || "parlay", odds: ui.odds || {}});
  else { S.betSel = []; S.teaserSel = []; S.odds = {}; }
  S.betSel = S.betSel.filter(id => BET_INDEX[id]); S.teaserSel = S.teaserSel.filter(id => LEG_INDEX[id]);
  if (ui) { S.f = Object.assign(S.f, ui.f || {}); S.tab = ui.tab || S.tab; }
  if (S.f.game !== "all" && !allBets().some(x => x.game === S.f.game)) S.f.game = "all";
  render();
}
async function loadFile(file) {
  let b;
  try { b = JSON.parse(await file.text()); } catch { toast("That file isn't valid JSON. Upload output/board.json."); return; }
  if (!validBoard(b)) { toast("That isn't a board file. Upload output/board.json from picks.py."); return; }
  setBoard(b, "file");
  LS.set("board", b);
  if (S.db && S.assets) {
    try {
      const up = await S.assets.upload(new Blob([JSON.stringify(b)], {type: "application/json"}), {type: "application/json"});
      await S.db.doc("app/board").set({assetId: up.id, season: b.meta.season, week: b.meta.week, generated: b.meta.generated || "", savedAt: new Date().toISOString()});
      toast("Board saved. It'll be here on your other devices too.");
    } catch { toast("Board loaded here, but couldn't be saved for other devices."); }
  } else toast("Board loaded");
}

/* ---------------------------------------------------------------- start */
/* where "Update odds now" points: the repo's workflow page, worked out from the site address */
function actionsUrl() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split("/").filter(Boolean)[0];
  return m && repo ? `https://github.com/${m[1]}/${repo}/actions/workflows/update.yml` : null;
}
async function start() {
  S.bankroll = LS.get("bankroll", 1000);
  $("#bankroll").value = S.bankroll;
  S.slips = LS.get("slips", []);
  const example = JSON.parse(document.getElementById("example-board").textContent);
  const cached = LS.get("board", null);
  if (validBoard(cached)) setBoard(cached, "saved"); else setBoard(example, "example");
  try {
    const res = await fetch("board.json?t=" + Date.now(), {cache: "no-store"});
    if (res.ok) { const b = await res.json(); if (validBoard(b)) { setBoard(b, "site"); LS.set("board", b); } }
  } catch {}
}
async function connect() {
  if (!window.claude?.use) return;
  const [db, assets] = await Promise.all([window.claude.use("db"), window.claude.use("assets")]);
  S.db = db; S.assets = assets;
  if (!db) return;
  S.store = "db";
  db.collection("slips").onSnapshot(snap => {
    S.slips = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if (S.tab === "mine") renderMine();
    renderBanner();
  }, () => { S.db = null; S.store = "local"; S.slips = LS.get("slips", []); render(); });
  try {
    const ptr = await db.doc("app/board").get();
    if (!ptr.exists) return;
    const {assetId, generated} = ptr.data();
    if (S.boardFrom !== "example" && generated && generated === M().generated) return;
    const res = await fetch("/_blob/" + assetId);
    if (!res.ok) return;
    const b = await res.json();
    if (validBoard(b)) { setBoard(b, "saved"); LS.set("board", b); }
  } catch {}
}
start();
</script>
